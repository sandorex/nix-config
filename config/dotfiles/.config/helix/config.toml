theme = "catppuccin_mocha"

[editor]
line-number = "relative"
trim-trailing-whitespace = true
rulers = [ 80, 100 ]
cursorline = true
# rainbow-brackets = true # TODO not yet released

[editor.lsp]
display-progress-messages = true

[editor.auto-save]
after-delay.enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"

[editor.whitespace.render]
tab = "all"
space = "none"

[editor.whitespace.characters]
tab = ">"
space = "·"

[editor.file-picker]
hidden = false

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

# use file picker in current directory by default
space."f" = "file_picker_in_current_directory"
space."F" = "file_picker"
space."A-f" = "file_picker_in_current_buffer_directory"

space."e" = "file_explorer_in_current_directory"
space."E" = "file_explorer"
space."A-e" = "file_explorer_in_current_buffer_directory"

# quick shortcuts for common things
"A-x" = ":buffer-previous"
"A-c" = ":buffer-next"

"A-w" = ":write"
"A-q" = ":quit"
"A-b" = ":buffer-close"

# toggle show space
space.t." " = ":toggle whitespace.render.space none all"
space.t."w" = [ ":toggle soft-wrap.enable", ":redraw" ]

# NOTE :toggle does not support theme
# quick theme change
space.t.t.d = ":theme catppuccin_mocha"
space.t.t.l = ":theme catppuccin_latte"

[keys.insert]
# most common keybinding for autocompletion across all editors
C-space = "completion"

[keys.select]
# make escaping selection faster
esc = [ "normal_mode", "collapse_selection", "keep_primary_selection" ]
";" = [ "collapse_selection", "normal_mode" ]
