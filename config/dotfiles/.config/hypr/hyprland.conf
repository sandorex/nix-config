source = monitor.conf

$mon1 = HDMI-A-1
$mon2 = DVI-D-1

# TODO add uwsm app -- to all launchers
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -show-icons

exec-once = /usr/lib/pam_kwallet_init # TODO check if this is neede with uwsm
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/waybar/waybar.sh hyprland
exec-once = nm-applet --indicator

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Breeze_Light
env = HYPRCURSOR_SIZE,24

# fix for dolphin mime issues
env = XDG_MENU_PREFIX,plasma-

source = theming.conf

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

source = input.conf

source = keybindings.conf

windowrulev2 = bordercolor rgb(800000) rgb(880808), fullscreen:1
windowrulev2 = bordercolor rgb(FFCEA3) rgb(F18D34), floating:1

windowrule = float, initialTitle:overskride
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = float, class:nm-connection-editor

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
